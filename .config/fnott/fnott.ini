# -*- conf -*-
# ~/.config/fnott/fnott.ini

# Layout
anchor=top-right
stacking-order=top-down
edge-margin-vertical=16
edge-margin-horizontal=16
notification-margin=10
min-width=320
max-width=400
max-height=200
padding-vertical=14
padding-horizontal=16

# Look
layer=overlay
background=1e1e2eee
border-color=89b4faff
border-size=2
border-radius=12
dpi-aware=no

# Icons
icon-theme=Papirus-Dark
max-icon-size=48

# Text
title-font=Iosevka:size=9
title-color=a6adc8ff
# title-format=<i>%a%A</i>
title-format=<i>%a</i>

summary-font=Iosevka:weight=bold:size=11
summary-color=cdd6f4ff
summary-format=<b>%s</b>\n

body-font=Iosevka:size=10
body-color=bac2deff
body-format=%b

# Progress bar (volume/brightness notifs)
progress-bar-height=10
progress-bar-color=89b4faff

# Behavior
selection-helper=fuzzel --dmenu
selection-helper-uses-null-separator=no
play-sound=paplay ${filename}
sound-file=/home/mal1kc/.config/sounds/cyperpunk_sfx_sound.ogg
max-timeout=300
default-timeout=8
idle-timeout=100

[low]
background=1e1e2ecc
border-color=45475aff
title-color=6c7086ff
summary-color=9399b2ff
body-color=7f849cff
default-timeout=5

[normal]
border-color=89b4faff

[critical]
background=2a1e26f0
border-color=f38ba8ff
summary-color=f38ba8ff
default-timeout=0
