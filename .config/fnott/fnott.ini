# -*- conf -*-
# ~/.config/fnott/fnott.ini

# Layout
anchor=top-right
# newest at the corner
stacking-order=bottom-up
edge-margin-vertical=12
edge-margin-horizontal=12
notification-margin=8
min-width=340
max-width=380
max-height=160
padding-vertical=12
padding-horizontal=14

# Look
layer=overlay
background=1e1e2ed9
border-color=89b4fa99
border-size=1
border-radius=12
dpi-aware=no

# Icons
icon-theme=Papirus-Dark
max-icon-size=40

# Text
title-font=Iosevka:size=9
title-color=a6adc8ff
# title-format=<i>%a%A</i>
# %A: * when there are actions (left click / notifs list)
title-format=<i>%a%A</i>

summary-font=Iosevka:weight=bold:size=11
summary-color=cdd6f4ff
summary-format=<b>%s</b>\n

body-font=Iosevka:size=10
body-color=bac2deff
body-format=%b

# Progress bar (volume/brightness notifs)
progress-bar-height=6
progress-color=89b4faff

# Behavior
selection-helper=fuzzel --dmenu
selection-helper-uses-null-separator=no
play-sound=paplay ${filename}
sound-file=/home/mal1kc/.config/sounds/notif.ogg

# Disappear after (seconds), also set in [low] and [critical]
# default-timeout: the app didn't say how long
# max-timeout: hard limit, also for apps that ask for "never"
default-timeout=6
max-timeout=10
# away this long: keep them until you are back
idle-timeout=100

[low]
background=1e1e2ebf
border-color=45475aff
title-color=6c7086ff
summary-color=9399b2ff
body-color=7f849cff
# not above fullscreen windows, no sound
layer=top
sound-file=
default-timeout=3
max-timeout=5
idle-timeout=0

[normal]
border-color=89b4fa99

[critical]
background=2a1e26e6
border-color=f38ba8ff
summary-color=f38ba8ff
default-timeout=20
max-timeout=30
