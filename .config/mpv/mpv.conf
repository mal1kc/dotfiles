sub-auto=fuzzy
sub-font='Hack NF'
osd-font="Hack NF"
sub-bold=yes
sub-font-size=44
osd-font-size=22

video-sync=display-resample

# Desktop
save-position-on-quit=yes
# laptop
# both: auto picks vaapi/nvdec when available, falls back to software
hwdec=auto

# for preview thumbnails
osc=no

screenshot-directory=~/pictures/mpv
border = no # Optional, but recommended
