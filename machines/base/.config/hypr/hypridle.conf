general {
    lock_cmd = ~/.config/hypr/scripts/lock          # dbus/sysd lock command (loginctl lock-session)
    after_sleep_cmd = ~/.config/hypr/scripts/lock   # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

listener {
    # Desktop
    # timeout = 1800                            # in seconds
    timeout = 500                            # in seconds
    on-timeout = ~/.config/hypr/scripts/notify "You are idle" 0 5000
}
